name: Publish to JetBrains Marketplace

# Publishing is decoupled from merging: only pushing a `v*` tag releases.
#
# Merging to main ships NOTHING. This is deliberate — the earlier "publish on every push to
# main" setup meant any code-only push with an un-bumped version raced the Marketplace, and a
# push with a bumped version published before anyone intended to release.
#
# To cut a release:
#   1. bump `version = "x.y.z"` in build.gradle.kts and update <change-notes> in plugin.xml
#   2. merge
#   3. git tag vX.Y.Z && git push origin vX.Y.Z
#
# The job refuses to run when the tag disagrees with build.gradle.kts, so a mistyped tag fails
# loudly instead of publishing the wrong version.
on:
  push:
    tags: ['v*']
  workflow_dispatch: {}

concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'   # Kotlin 1.9 compiler is unstable on newer JDKs; pin 17
          cache: gradle

      - name: Check the tag matches build.gradle.kts
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          VERSION=$(grep -E '^version = ' build.gradle.kts | head -1 | sed -E 's/.*"([^"]+)".*/\1/')
          TAG="${GITHUB_REF_NAME#v}"
          if [ -z "$VERSION" ]; then echo "Could not parse version from build.gradle.kts"; exit 1; fi
          if [ "$VERSION" != "$TAG" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match build.gradle.kts version $VERSION"
            exit 1
          fi
          echo "Publishing version $VERSION"

      # Gate: run the JetBrains Plugin Verifier before publishing. Fails the job (and blocks
      # the publish step below) on internal-API / compatibility / structural problems.
      # Downloads the latest IDEA (~1.5 GB). failureLevel is configured in build.gradle.kts.
      - name: Verify plugin (pre-publish gate)
        run: ./gradlew verifyPlugin --no-daemon --stacktrace

      - name: Publish plugin
        env:
          PUBLISH_TOKEN: ${{ secrets.PUBLISH_TOKEN }}
        run: ./gradlew publishPlugin --no-daemon --stacktrace
